# macOS Dev Audit Tool - Default Configuration
#
# This file contains the default values for all configuration options.
# These can be overridden by:
#   1. System config: /etc/mac-dev-audit/config
#   2. User config:   ~/.config/mac-dev-audit/config
#   3. CLI flags (highest priority)

# Size threshold for directory warnings (in GB)
threshold_gb=1

# Output format: human or json
output_format=human

# Verbose output (true/false)
verbose=false
